
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto Smart TV Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .remote-container {
            width: 100%;
            max-width: 380px;
            background-color: #111827;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid #1f2937;
        }

        /* Barra de Estado / Conexión */
        .status-card {
            background-color: #1f2937;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .status-card:hover {
            background-color: #374151;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wifi-icon {
            color: #ef4444;
            font-size: 1.2rem;
        }

        .wifi-connected {
            color: #22c55e !important;
        }

        .status-text .title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .status-text .subtitle {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .btn-search {
            background-color: #1d4ed8;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Fila Superior */
        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .btn-round {
            background-color: #1f2937;
            color: #e5e7eb;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-round:active {
            transform: scale(0.92);
        }

        .btn-power {
            background-color: #2b161a;
            color: #ef4444;
        }

        /* Pad Direccional Circular */
        .d-pad-container {
            position: relative;
            width: 220px;
            height: 220px;
            background-color: #161e2e;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.2);
        }

        .d-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 1.25rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .d-btn:active {
            color: #ffffff;
        }

        .d-up { top: 10px; left: 50%; transform: translateX(-50%); }
        .d-down { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .d-left { left: 10px; top: 50%; transform: translateY(-50%); }
        .d-right { right: 10px; top: 50%; transform: translateY(-50%); }

        .btn-ok {
            width: 80px;
            height: 80px;
            background-color: #1f2937;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-ok:active {
            transform: scale(0.92);
            background-color: #374151;
        }

        /* Fila Central */
        .nav-middle {
            display: flex;
            justify-content: space-around;
            padding: 0 15px;
        }

        .btn-pill {
            background-color: #1f2937;
            color: #e5e7eb;
            border: none;
            border-radius: 24px;
            width: 60px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .btn-pill:active {
            transform: scale(0.92);
        }

        /* Volumen / Canales */
        .media-controls-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
        }

        .vol-ch-group {
            background-color: #1f2937;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .vc-btn {
            background-color: transparent;
            border: none;
            color: #e5e7eb;
            padding: 14px 0;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: background 0.2s;
        }

        .vc-btn:active {
            background-color: #374151;
        }

        .vc-label {
            font-size: 0.65rem;
            color: #9ca3af;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .playback-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-small-round {
            background-color: #1f2937;
            color: #e5e7eb;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .btn-small-round:active {
            transform: scale(0.92);
        }

        /* Barras de Colores */
        .colored-bars {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 4px;
        }

        .bar {
            height: 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .bar-red { background-color: #ef4444; }
        .bar-green { background-color: #22c55e; }
        .bar-yellow { background-color: #eab308; }
        .bar-blue { background-color: #3b82f6; }

        /* Apps */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .app-btn {
            background-color: #1f2937;
            color: #e5e7eb;
            border: none;
            border-radius: 14px;
            padding: 10px 4px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .app-btn:active {
            transform: scale(0.92);
        }

        .app-netflix { color: #ef4444; }
        .app-youtube { color: #ff0000; }
        .app-prime { color: #38bdf8; }
        .app-disney { color: #60a5fa; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: #1f2937;
            width: 100%;
            max-width: 340px;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tv-list-item {
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 12px 16px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .tv-list-item:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .tv-item-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .tv-item-ip {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .manual-input-box {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .manual-input-box input {
            flex: 1;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85rem;
        }

        .btn-close-modal {
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="remote-container">
        <!-- Barra de Estado / IP -->
        <div class="status-card" onclick="openTvMenu()">
            <div class="status-info">
                <span id="wifiIcon" class="wifi-icon">📶</span>
                <div class="status-text">
                    <div id="statusTitle" class="title">Buscando Smart TV...</div>
                    <div id="statusSubtitle" class="subtitle">Sin conexión activa</div>
                </div>
            </div>
            <button class="btn-search" onclick="event.stopPropagation(); startNetworkScan();">🔍 Escanear</button>
        </div>

        <!-- Botones Superiores -->
        <div class="top-actions">
            <button class="btn-round btn-power" onclick="sendKey('Power')">⏻</button>
            <button class="btn-round" onclick="sendKey('InputTuner')">➔</button>
            <button class="btn-round" onclick="sendKey('VolumeMute')">🔇</button>
        </div>

        <!-- Pad Direccional Circular -->
        <div class="d-pad-container">
            <button class="d-btn d-up" onclick="sendKey('Up')">▲</button>
            <button class="d-btn d-left" onclick="sendKey('Left')">◄</button>
            <button class="btn-ok" onclick="sendKey('Select')">OK</button>
            <button class="d-btn d-right" onclick="sendKey('Right')">►</button>
            <button class="d-btn d-down" onclick="sendKey('Down')">▼</button>
        </div>

        <!-- Botones de Navegación Central -->
        <div class="nav-middle">
            <button class="btn-pill" onclick="sendKey('Back')">↩</button>
            <button class="btn-pill" onclick="sendKey('Home')">🏠</button>
            <button class="btn-pill" onclick="sendKey('Info')">☰</button>
        </div>

        <!-- Volumen y Canales -->
        <div class="media-controls-grid">
            <div class="vol-ch-group">
                <button class="vc-btn" onclick="sendKey('VolumeUp')">
                    <span style="font-size: 1.1rem;">+</span>
                    <span class="vc-label">VOL</span>
                </button>
                <button class="vc-btn" onclick="sendKey('VolumeDown')">
                    <span style="font-size: 1.1rem;">-</span>
                </button>
            </div>

            <div class="playback-column">
                <button class="btn-small-round" onclick="sendKey('Play')">▶</button>
                <button class="btn-small-round" onclick="sendKey('Pause')">⏸</button>
            </div>

            <div class="vol-ch-group">
                <button class="vc-btn" onclick="sendKey('ChannelUp')">
                    <span style="font-size: 1.1rem;">▲</span>
                    <span class="vc-label">CH</span>
                </button>
                <button class="vc-btn" onclick="sendKey('ChannelDown')">
                    <span style="font-size: 1.1rem;">▼</span>
                </button>
            </div>
        </div>

        <!-- Barras de Colores -->
        <div class="colored-bars">
            <button class="bar bar-red" onclick="sendKey('Lit_a')"></button>
            <button class="bar bar-green" onclick="sendKey('Lit_b')"></button>
            <button class="bar bar-yellow" onclick="sendKey('Lit_c')"></button>
            <button class="bar bar-blue" onclick="sendKey('Lit_d')"></button>
        </div>

        <!-- Apps -->
        <div class="apps-grid">
            <button class="app-btn" onclick="launchApp('12')">
                <span class="app-netflix">▶</span> Netflix
            </button>
            <button class="app-btn" onclick="launchApp('837')">
                <span class="app-youtube">▶</span> YouTube
            </button>
            <button class="app-btn" onclick="launchApp('13')">
                <span class="app-prime">▶</span> Prime
            </button>
            <button class="app-btn" onclick="launchApp('291097')">
                <span class="app-disney">▶</span> Disney+
            </button>
        </div>
    </div>

    <!-- Menú Modal de TVs -->
    <div id="tvModal" class="modal-overlay" onclick="closeTvMenu()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>Smart TVs en la Red Wi-Fi</span>
                <span style="cursor:pointer; color:#9ca3af;" onclick="closeTvMenu()">✕</span>
            </div>
            
            <div id="tvListContainer" style="display: flex; flex-direction: column; gap: 8px;">
                <div id="scanStatus" style="font-size:0.8rem; color:#9ca3af; text-align:center;">Presiona Escanear o ingresa la IP.</div>
            </div>

            <div class="manual-input-box">
                <input type="text" id="manualIp" placeholder="IP manual (ej: 192.168.1.15)">
                <button class="btn-search" onclick="connectManual()">Conectar</button>
            </div>

            <button class="btn-close-modal" onclick="closeTvMenu()">Cerrar</button>
        </div>
    </div>

    <script>
        let currentTvIp = "";

        // Envía peticiones HTTP ECP/REST directamente a la IP de la TV en la red local
        async function sendKey(key) {
            if (!currentTvIp) {
                openTvMenu();
                return;
            }
            try {
                // Envía comando mediante la API REST estándar de Smart TV / Roku ECP
                await fetch(`http://${currentTvIp}:8060/keypress/${key}`, { method: 'POST', mode: 'no-cors' });
                console.log(`Comando enviado: ${key} -> ${currentTvIp}`);
            } catch (err) {
                console.error("Error al enviar comando:", err);
            }
        }

        async function launchApp(appId) {
            if (!currentTvIp) {
                openTvMenu();
                return;
            }
            try {
                await fetch(`http://${currentTvIp}:8060/launch/${appId}`, { method: 'POST', mode: 'no-cors' });
            } catch (err) {
                console.error("Error al abrir App:", err);
            }
        }

        // Escaneo de red local (HTTP Pings a subred común 192.168.1.X)
        async function startNetworkScan() {
            openTvMenu();
            const container = document.getElementById('tvListContainer');
            const status = document.getElementById('scanStatus');
            status.textContent = "Escaneando subred local (192.168.1.1 - 254)...";
            container.innerHTML = "";
            container.appendChild(status);

            let foundCount = 0;
            // Escaneo asíncrono de rango local por puerto 8060 (Roku/SmartTV)
            const baseSubnet = "192.168.1.";
            const promises = [];

            for (let i = 2; i < 254; i++) {
                const testIp = baseSubnet + i;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 400);

                const p = fetch(`http://${testIp}:8060/query/device-info`, { method: 'GET', signal: controller.signal, mode: 'no-cors' })
                    .then(() => {
                        clearTimeout(timeoutId);
                        foundCount++;
                        addTvToList("Smart TV Detectada", testIp);
                    })
                    .catch(() => clearTimeout(timeoutId));
                
                promises.push(p);
            }

            await Promise.allSettled(promises);
            if (foundCount === 0) {
                status.textContent = "No se hallaron TVs automáticamente. Ingresa la IP de tu TV abajo.";
            } else {
                status.textContent = `Escaneo finalizado. Se encontraron ${foundCount} dispositivo(s).`;
            }
        }

        function addTvToList(name, ip) {
            const container = document.getElementById('tvListContainer');
            const item = document.createElement('div');
            item.className = 'tv-list-item';
            item.onclick = () => selectTv(name, ip);
            item.innerHTML = `
                <div>
                    <div class="tv-item-name">${name}</div>
                    <div class="tv-item-ip">${ip}</div>
                </div>
                <span style="color: #22c55e; font-size: 0.8rem;">Conectar</span>
            `;
            container.appendChild(item);
        }

        function connectManual() {
            const ip = document.getElementById('manualIp').value.trim();
            if (ip) {
                selectTv("Smart TV", ip);
            }
        }

        function selectTv(name, ip) {
            currentTvIp = ip;
            document.getElementById('statusTitle').textContent = name;
            document.getElementById('statusSubtitle').textContent = ip;
            document.getElementById('wifiIcon').classList.add('wifi-connected');
            closeTvMenu();
        }

        function openTvMenu() {
            document.getElementById('tvModal').style.display = 'flex';
        }

        function closeTvMenu() {
            document.getElementById('tvModal').style.display = 'none';
        }
    </script>
</body>
</html>
